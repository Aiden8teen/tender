version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mithaq_tender_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mithaq
      POSTGRES_PASSWORD: mithaq_secret
      POSTGRES_DB: mithaq_tender_db
    ports:
      - "5432:5432"
    volumes:
      - mithaq_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mithaq -d mithaq_tender_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mithaq_tender_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mithaq_redisdata:/data

volumes:
  mithaq_pgdata:
  mithaq_redisdata:
